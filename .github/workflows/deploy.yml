name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      crowdin_pr:
        description: Number of the Crowdin PR being deployed, to announce it in Discord (optional)
        required: false
        default: ''
  push:
    branches:
      - main
  # Crowdin puts "[ci skip]" in every commit message, and a squash merge copies
  # them into the commit on main, so the push trigger above never fires for
  # Crowdin PRs. The skip markers don't apply to pull_request_target, so deploy
  # when a Crowdin PR is merged too. Only main is checked out, never PR code.
  pull_request_target:
    types: [closed]
    branches:
      - main

# Queue deploys rather than letting two copy to the server at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.merged && github.event.pull_request.head.ref == 'l10n_main')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For a merged Crowdin PR, deploy main; otherwise the default (the pushed commit).
          ref: ${{ github.event_name == 'pull_request_target' && 'main' || '' }}

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn build

      - name: copy compiled assets to remote
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: build
          target: public_html/docs.flarum.org

      - name: Announce Crowdin deploy in Discord
        if: >-
          inputs.crowdin_pr != '' ||
          (github.event_name == 'pull_request_target' && github.event.pull_request.head.ref == 'l10n_main')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_NUMBER: ${{ inputs.crowdin_pr || github.event.pull_request.number }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not set; skipping."
            exit 0
          fi

          jq -n \
            --arg number "$PR_NUMBER" \
            --arg url "$REPO_URL/pull/$PR_NUMBER" \
            '{
              username: "GitHub",
              allowed_mentions: { parse: [] },
              embeds: [{
                title: ("Crowdin updates deployed (#" + $number + ")"),
                url: $url,
                description: "The latest translations are live on docs.flarum.org.",
                color: 5763719
              }]
            }' > payload.json

          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$DISCORD_WEBHOOK_URL"
